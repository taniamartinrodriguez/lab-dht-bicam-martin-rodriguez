name: BiCIAM - JUnit, JaCoCo y SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad-y-sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo y su historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17 y Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar, ejecutar JUnit y generar JaCoCo, PMD, Checkstyle y SpotBugs
        run: mvn -B -ntp -Pquality clean verify

      - name: Exigir al menos 80 % de lineas por clase probada
        run: python3 scripts/check_sonar_coverage.py target/site/jacoco/jacoco.xml

      - name: Convertir hallazgos de PMD, Checkstyle y SpotBugs
        run: python3 scripts/sonar_external_issues.py

      - name: Conservar pruebas e informes como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-calidad-biciam
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pmd.xml
            target/checkstyle-result.xml
            target/spotbugs.xml
            target/spotbugsXml.xml
            target/sonar/external-issues.json

      # La primera ejecucion en main falla de forma explicita si aun no
      # se han configurado las credenciales. No presenta una subida ficticia.
      - name: Analizar en SonarQube Cloud
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo '::error::Configura SONAR_TOKEN (secreto), SONAR_ORGANIZATION y SONAR_PROJECT_KEY (variables) en Settings > Secrets and variables > Actions.'
            exit 1
          fi
          test -s target/site/jacoco/jacoco.xml
          test -s target/sonar/external-issues.json
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN"
